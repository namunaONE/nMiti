name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # merge-queue support: CI re-runs on the combined result

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - run: dart analyze
      # Workspace root has no test/ dir; the suites live in member packages.
      # 'dart test packages' scans all members, so future packages are covered automatically.
      - run: dart test packages
      - run: dart run nmiti_cli:invariants --core data/calendar_bs_core_1975_2083.csv --tail data/calendar_bs_tail_2084_2100.csv
      # Full site build as a PR gate: catches build_site.dart and data
      # regressions before merge, not only after the post-deploy smoke.
      - run: dart run nmiti_cli:build_site --out build/site --url https://namunaone.github.io/nMiti/

      # Pre-merge smoke parity (incident 2026-11-03: the post-deploy smoke
      # failed on main because its checks had never run pre-merge). The same
      # independent Python contract the post-deploy smoke enforces, run here
      # against the build output: static markers on every artifact plus the
      # today/sankranti recomputes. Shared script - scripts/site_contract.py -
      # so the pre-merge and post-deploy gates cannot drift apart.
      - run: python3 scripts/site_contract.py --dir build/site
