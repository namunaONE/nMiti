name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # merge-queue support: CI re-runs on the combined result

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - run: dart analyze
      # Workspace root has no test/ dir; the suites live in member packages.
      # 'dart test packages' scans all members, so future packages are covered automatically.
      - run: dart test packages
      - run: dart run nmiti_cli:invariants --core data/calendar_bs_core_1975_2083.csv --tail data/calendar_bs_tail_2084_2100.csv
