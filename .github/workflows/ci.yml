name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # merge-queue support: CI re-runs on the combined result

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - run: dart analyze
      # Workspace root has no test/ dir; the suites live in member packages.
      # 'dart test packages' scans all members, so future packages are covered automatically.
      # The expanded output is tee'd so the annotation step
      # below can name every failing test on the run page (the
      # aggregate exit-code line alone hides which test broke).
      - name: dart test packages
        run: |
          set -o pipefail
          dart test packages --reporter expanded 2>&1 | tee dart_test_output.txt
      - name: name the failing tests as run annotations
        if: failure()
        run: |
          grep -F '[E]' dart_test_output.txt | while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
          done || true
      - run: dart run nmiti_cli:invariants --core data/calendar_bs_core_1975_2083.csv --tail data/calendar_bs_tail_2084_2100.csv
      # Full site build as a PR gate: catches build_site.dart and data
      # regressions before merge, not only after the post-deploy smoke.
      - run: dart run nmiti_cli:build_site --out build/site --url https://namunaone.github.io/nMiti/

      # Pre-merge smoke parity (incident 2026-11-03: the post-deploy smoke
      # failed on main because its checks had never run pre-merge). The same
      # independent Python contract the post-deploy smoke enforces, run here
      # against the build output: static markers on every artifact plus the
      # today/sankranti recomputes. Shared script - scripts/site_contract.py -
      # so the pre-merge and post-deploy gates cannot drift apart.
      - run: python3 scripts/site_contract.py --dir build/site

      # HYA-369: Swiss-truth cross-check of the lunar engine. The MIT engine
      # dumps every limb boundary + Kathmandu sunrise in the corpus window;
      # this harness re-solves each boundary with Swiss Ephemeris (pyswisseph,
      # Moshier file-free mode, Lahiri sidereal mode), scores the gap, flags
      # knife-edge boundaries and enforces the provisional bands. License
      # boundary: pyswisseph is AGPL-3 and is invoked only by this CI harness
      # - no shipped package links against it, and the only outputs are
      # numeric facts. See tools/sweph/README.md.
      - run: dart run nmiti_cli:dump_limb_instants --start 2026-10-16 --end 2026-12-02 --out build/limb_instants.json
      - run: python3 -m pip install --quiet pyswisseph
      - run: python3 tools/sweph/sweph_crosscheck.py --instants build/limb_instants.json --receipts build/sweph_receipts.json
