name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # merge-queue support: CI re-runs on the combined result

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - run: dart analyze
      # Workspace root has no test/ dir; the suites live in member packages.
      # 'dart test packages' scans all members, so future packages are covered automatically.
      # The expanded output is tee'd so the annotation step
      # below can name every failing test on the run page (the
      # aggregate exit-code line alone hides which test broke).
      - name: dart test packages
        run: |
          set -o pipefail
          dart test packages --reporter expanded 2>&1 | tee dart_test_output.txt
      - name: name the failing tests as run annotations
        if: failure()
        run: |
          grep -A 6 -F '[E]' dart_test_output.txt | while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
          done || true
      - run: dart run nmiti_cli:invariants --core data/calendar_bs_core_1975_2083.csv --tail data/calendar_bs_tail_2084_2100.csv
      # Full site build as a PR gate: catches build_site.dart and data
      # regressions before merge, not only after the post-deploy smoke.
      - run: dart run nmiti_cli:build_site --out build/site --url https://namunaone.github.io/nMiti/

      # Pre-merge smoke parity (incident 2026-11-03: the post-deploy smoke
      # failed on main because its checks had never run pre-merge). The same
      # independent Python contract the post-deploy smoke enforces, run here
      # against the build output: static markers on every artifact plus the
      # today/sankranti recomputes. Shared script - scripts/site_contract.py -
      # so the pre-merge and post-deploy gates cannot drift apart.
      - run: python3 scripts/site_contract.py --dir build/site

      # HYA-369: Swiss-truth cross-check of the lunar engine. The MIT engine
      # dumps every limb boundary + Kathmandu sunrise in the corpus window;
      # this harness re-solves each boundary with Swiss Ephemeris (pyswisseph,
      # Moshier file-free mode, Lahiri sidereal mode), scores the gap, flags
      # knife-edge boundaries and enforces the provisional bands. License
      # boundary: pyswisseph is AGPL-3 and is invoked only by this CI harness
      # - no shipped package links against it, and the only outputs are
      # numeric facts. See tools/sweph/README.md.
      - run: dart run nmiti_cli:dump_limb_instants --start 2026-10-16 --end 2026-12-02 --out build/limb_instants.json
      - run: python3 -m pip install --quiet pyswisseph
      - run: python3 tools/sweph/sweph_crosscheck.py --instants build/limb_instants.json --receipts build/sweph_receipts.json --summary build/sweph_summary.md
      # The crosscheck log is sign-in-gated, so the harness also emits
      # the scoreboard as notice annotations and this markdown summary;
      # GitHub renders both on the run page without log access.
      # if: always() so a banded failure still shows the measured deltas.
      - name: sweph scoreboard to the run summary
        if: always()
        run: |
          if [ -f build/sweph_summary.md ]; then
            cat build/sweph_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # HYA-450 (Wave 1 graha engine): Swiss-truth cross-check of the
      # vendored VSOP87D planetary channels - Mercury, Venus, Mars,
      # Jupiter, Saturn and the mean node (Rahu) at the 12:00 UT
      # instants the dump tool adds to limb_instants.json. Same pattern
      # as the lunar crosscheck: pyswisseph Moshier file-free mode,
      # Lahiri sidereal, provisional bands (hard 120 arcsec, mean 30
      # arcsec) - receipts-first, tightened only on measured evidence.
      # License boundary: as above, pyswisseph is CI-harness-only.
      - run: python3 tools/sweph/graha_crosscheck.py --instants build/limb_instants.json --summary build/graha_summary.md
      - name: graha scoreboard to the run summary
        if: always()
        run: |
          if [ -f build/graha_summary.md ]; then
            cat build/graha_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # HYA-369 follow-up (engine-perfection research move #2): ELP2000-82B
      # truncation spike. Downloads the IMCCE ELP82B public data at CI time,
      # truncates it per the NASA Five Millennium Canon recipe and measures
      # what a NASA-canon-class moon would do to the tithi/karana bands at
      # the engine's own boundary instants (predicted bands plus perfect-
      # geometric/perfect-apparent floors). Facts out, license clean:
      # ELP2000-82B is public research data (Bureau des Longitudes/IMCCE),
      # nothing from it ships in any artifact and the MIT engine is
      # untouched - a future engine upgrade is its own PR. urllib is stdlib;
      # pyswisseph is already installed by the crosscheck step above.
      - run: python3 tools/sweph/elp_spike.py --instants build/limb_instants.json --receipts build/sweph_receipts.json --out build/elp_spike.json --summary build/elp_spike_summary.md
      - name: elp spike summary to the run summary
        if: always()
        run: |
          if [ -f build/elp_spike_summary.md ]; then
            cat build/elp_spike_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # HYA-369 engine upgrade: the vendored ELP2000-82B Dart table under
      # packages/nepali_panchang/lib/src/elp2000/ is GENERATED by
      # tools/sweph/elp_build_table.py from the public IMCCE data (license:
      # numeric facts only - see tools/sweph/README.md). This gate
      # regenerates it from the build/elp82b download above and fails on ANY
      # byte drift, so a stale or hand-edited table can never ride a
      # generator/recipe change through review. The generator prints the
      # 47.a anchor values as notices - keep moon_47a_test.dart in step.
      # Guarded on directory presence: PRs from before the upgrade (no
      # table yet) pass. stdlib only; no extra downloads.
      - name: elp2000 vendored table freshness gate
        run: |
          if [ ! -d packages/nepali_panchang/lib/src/elp2000 ]; then
            echo "no vendored elp2000 table yet - gate skipped"
            exit 0
          fi
          python3 tools/sweph/elp_build_table.py --data-dir build/elp82b --out-dir build/elp2000_check
          diff -r packages/nepali_panchang/lib/src/elp2000 build/elp2000_check


      # HYA-450: the vendored VSOP87D graha table under
      # packages/nepali_panchang/lib/src/graha/ is GENERATED by
      # tools/sweph/graha_build_table.py from the public IMCCE data
      # (license: numeric facts only - see tools/sweph/README.md).
      # Same freshness contract as the elp2000 gate above: regenerate
      # from source, fail on ANY byte drift, guarded on directory
      # presence. The generator self-downloads the six VSOP87D files
      # (IMCCE with a ctdk mirror fallback) into build/vsop87 when
      # they are missing; stdlib only.
      - name: graha VSOP87D vendored table freshness gate
        run: |
          if [ ! -d packages/nepali_panchang/lib/src/graha ]; then
            echo "no vendored graha table yet - gate skipped"
            exit 0
          fi
          python3 tools/sweph/graha_build_table.py --data-dir build/vsop87 --out-dir build/graha_check
          diff -r packages/nepali_panchang/lib/src/graha build/graha_check
