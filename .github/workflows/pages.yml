name: Site

on:
  push:
    branches: [main]
  schedule:
    # Rebuild every 6h. GitHub documents that scheduled runs are delayed
    # under high load and queued jobs can be DROPPED - on the first night
    # after launch (2026-11-02/03) BOTH midnight runs were skipped and the
    # site served the previous date for hours. The Nepal-midnight rollover
    # therefore gets THREE independent shots (00:00, 00:30, 01:00 NPT); the
    # browser-side Nepal-time guard (build_site.dart) corrects the page for
    # humans no matter what, and the correctness canary alarms if the static
    # build is stale or wrong.
    - cron: "15 */6 * * *" # 00:15/06:15/12:15/18:15 UTC; the 18:15 run = 00:00 NPT rollover
    - cron: "45 18 * * *" # 18:45 UTC = 00:30 NPT rollover backstop
    - cron: "15 19 * * *" # 19:15 UTC = 01:00 NPT rollover guard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Note: a scheduled run may cancel an in-flight push deploy of the same
  # commit; both deploy identical HEAD content, so this is harmless.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - run: dart run nmiti_cli:invariants --core data/calendar_bs_core_1975_2083.csv --tail data/calendar_bs_tail_2084_2100.csv
      - run: dart run nmiti_cli:build_site --out build/site --url https://namunaone.github.io/nMiti/
        env:
          NM_COMMIT_SHA: ${{ github.sha }}
          NM_RUN_ID: ${{ github.run_id }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Defense in depth, layer 6 — N-version: the deployed output is verified by
  # an INDEPENDENT implementation (Python, straight from the canonical CSV),
  # not by the Dart engine that produced it. A wrong date on a date site is
  # worse than no site. Fetches retry: transient 5xx during CDN propagation
  # must not produce false alarms.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify deployed output against an independent implementation
        run: |
          python3 - <<'PY'
          import datetime, json, os, sys, time, urllib.request, zoneinfo

          url = "https://namunaone.github.io/nMiti/"
          bust = "?cachebust=" + os.environ.get("GITHUB_RUN_ID", "0")

          def get(u):
              for attempt in range(3):
                  try:
                      return urllib.request.urlopen(u, timeout=60)
                  except Exception as e:
                      print("fetch attempt " + str(attempt + 1) + " of " + u + " failed: " + str(e))
                      if attempt == 2:
                          raise
                      time.sleep(30)

          # Independent expectation for the answer label and the calendar API
          # path: computed from the raw CSV, not via Dart.
          rows = {}
          with open("data/calendar_bs_core_1975_2083.csv") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  cols = line.split(",")
                  if cols[0] == "bs_year":
                      continue
                  rows[int(cols[0])] = (
                      datetime.date.fromisoformat(cols[1]),
                      [int(x) for x in cols[3:15]],
                  )
          today = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Kathmandu")).date()
          by = max(y for y in rows if rows[y][0] <= today)
          b1, months = rows[by]
          if today >= b1 + datetime.timedelta(days=sum(months)):
              print("SMOKE FAIL: today falls outside the core table")
              sys.exit(1)
          doy = (today - b1).days + 1
          m, d = 1, doy
          for length in months:
              if d <= length:
                  break
              d -= length
              m += 1

          deployed = json.load(get(url + "api/v1/today.json" + bust))
          got = (deployed["bs"]["year"], deployed["bs"]["month"], deployed["bs"]["day"])
          ok = True

          gen = datetime.datetime.fromisoformat(deployed["generated_at_utc"].replace("Z", "+00:00"))
          age = datetime.datetime.now(datetime.timezone.utc) - gen
          if age > datetime.timedelta(hours=26):
              print("SMOKE FAIL: stale build, generated " + str(age) + " ago (> 26h freshness SLA)")
              ok = False

          page = get(url + "index.html" + bust).read().decode("utf-8")
          names = ["Baisakh", "Jestha", "Ashadh", "Shrawan", "Bhadra", "Ashwin",
                   "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"]
          label = names[m - 1] + " " + str(d) + ", " + str(by) + " BS"
          if label not in page:
              print("SMOKE FAIL: index.html does not contain the answer label '" + label + "'")
              ok = False

          # Everything else - client-guard anchors, honesty-page anchors,
          # canonical served CSVs, widget markers, and the independent
          # today/sankranti recomputes - is enforced by the SAME contract
          # script ci.yml runs pre-merge against the build output, so the
          # pre-merge gate and this post-deploy gate cannot drift apart
          # (incident 2026-11-03: these checks ran only post-merge, and
          # the first execution failed on main).
          sys.path.insert(0, "scripts")
          import site_contract

          def read_text(rel):
              return get(url + rel + bust).read().decode("utf-8")

          for failure in site_contract.check(read_text):
              print("SMOKE FAIL: " + failure)
              ok = False

          for path in ["", "accuracy.html", "methodology.html", "data.html", "docs.html", "embed/v1/widget.js", "embed/example.html", "data/calendar_bs_core_1975_2083.csv", "data/calendar_bs_tail_2084_2100.csv", "data/sankranti_moments_1975_2083.csv", "data/sankranti_moments_1975_2100.csv", "sankranti.html", "masa.html", "panchang.html", "bhadra.html", "panchak.html", "chandra-darshan.html", "lagna.html", "graha.html", "dasha.html", "vrat.html", "saait.html", "muhurta.html", "ayanamsa.html", "grahan.html", "festivals.html", "api/v1/sankranti.json", "api/v1/today.json", "api/v1/calendar/" + str(by) + ".json", "llms.txt", "robots.txt"]:
              r = get(url + path + (bust if path else ""))
              if r.status != 200:
                  print("SMOKE FAIL: " + path + " -> HTTP " + str(r.status))
                  ok = False

          if not ok:
              sys.exit(1)
          print("SMOKE OK: deployed " + str(got) + " matches the independent computation; freshness " + str(age))
          PY

  # Defense in depth, layer 7 — alert-first. A wrong nightly build with no new
  # commit cannot be fixed by a revert, so the universal action is an urgent
  # issue; a push-triggered failure additionally gets an auto-revert PR that a
  # human approves. Note: issues opened by the workflow token notify repo
  # watchers — make sure the maintainer watches this repository.
  alert:
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Open urgent issue (+ auto-revert PR for push-triggered failures)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create urgent --color d73a4a --description "needs urgent attention" --force 2>/dev/null || true
          gh label create revert --color b60205 --description "auto-generated rollback" --force 2>/dev/null || true
          if gh issue list --state open --json title --jq '.[].title' | grep -qF 'URGENT: post-deploy smoke test failed'; then
            echo "urgent issue already open — not duplicating"
          else
            gh issue create --title "URGENT: post-deploy smoke test failed" --body "The post-deploy smoke test failed after deploying to GitHub Pages. A wrong date on a date site is worse than no site — triage before the next rebuild. Failing run: ${RUN_URL}" --label urgent || true
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            git config user.name "nmiti-automation"
            git config user.email "actions@users.noreply.github.com"
            git checkout -b "revert/smoke-${{ github.run_id }}" || exit 0
            git revert --no-edit HEAD || exit 0
            git push origin "revert/smoke-${{ github.run_id }}"
            gh pr create               --title "revert: smoke test failed on main"               --body "Post-deploy smoke test failed; auto-generated revert. A human approves the rollback. Run: ${RUN_URL}"               --label revert --label urgent || true
          fi
